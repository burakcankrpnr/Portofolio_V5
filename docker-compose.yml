services:
  beril:
    image: accvalo/portofolio-v5-beril
    build:
      context: .
      dockerfile: Dockerfile.beril
    container_name: beril-api
    restart: always
    environment:
      BERIL_HOST: "0.0.0.0"
      BERIL_PORT: "3001"
      BERIL_DATA_DIR: "/data"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - beril-data:/data
    expose:
      - "3001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # /data volume yazılabilir; kök fs read_only
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50M

  frontend:
    image: accvalo/portofolio-v5
    build:
      context: .
      dockerfile: Dockerfile
    container_name: www.burakcankorpinar.dev
    hostname: www.burakcankorpinar.dev
    restart: always
    ports:
      - "32008:80"
    depends_on:
      - beril
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50M
      - /var/cache/nginx:noexec,nosuid,size=50M
      - /var/run:noexec,nosuid,size=10M
      - /var/log/nginx:noexec,nosuid,size=10M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  beril-data:
