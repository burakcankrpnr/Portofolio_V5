# www -> apex (canonical host) 301 yönlendirmesi
# GSC'de indexlenmesi gereken URL budur, www indexlenmemeli.
server {
    listen 80;
    server_name www.burakcankorpinar.dev;

    return 301 https://burakcankorpinar.dev$request_uri;
}

server {
    listen 80;
    server_name burakcankorpinar.dev _;
    root /usr/share/nginx/html;
    index index.html;

    error_log /dev/stderr warn;
    access_log /dev/stdout;

    # Gizli dosyalara erişimi engelle
    location ~ /\. {
        deny all;
    }

    location ~* \.(sh|env|bak|sql|log)$ {
        deny all;
    }

    location /previews/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ES modules (.mjs) — yanlış MIME + nosniff worker’ı kırar
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Beril OpenAI çeviri API (/api/beril/* → beril:3001/beril/*)
    location /api/ {
        proxy_pass http://beril:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 42m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
